<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="#070a08"/>
  <rect x="2" y="2" width="60" height="60" rx="12" fill="none" stroke="#39ff14" stroke-width="2" stroke-opacity="0.5"/>
  <polygon points="32,8 54,20 54,44 32,56 10,44 10,20" fill="#101811" stroke="#39ff14" stroke-width="2" filter="url(#glow)"/>
  <text x="32" y="39" font-family="'Consolas', monospace" font-size="24" font-weight="900" fill="#39ff14" text-anchor="middle" filter="url(#glow)">K</text>
</svg>
